services:
  - type: web
    name: indic-llmlingua-dashboard
    env: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    autoDeploy: true
    envVars:
      - key: APP_ENV
        value: production
      - key: MODEL_DIR
        value: /opt/render/project/src/submission_artifacts/model
      - key: DEVICE
        value: cpu
      - key: MAX_LENGTH
        value: "512"
      - key: RAG_GENERATOR_PROVIDER
        value: mock
      - key: RAG_FAISS_INDEX_PATH
        value: /opt/render/project/src/corpus/index
